[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagan-gen"
version = "0.22.0"
description = "PAGAN (Pixel Art Grammar And Notation): write pixel art as text, build it into PNGs and game-ready assets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Golino" }]
keywords = ["pixel-art", "sprites", "godot", "game-assets", "mcp", "procedural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6",
    "numpy>=1.26",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://pagan.top/"
Source = "https://github.com/lukasgolino/pagan"
Issues = "https://github.com/lukasgolino/pagan/issues"
Changelog = "https://github.com/lukasgolino/pagan/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.15", "types-PyYAML"]
mcp = []  # kept so `pagan[mcp]` requirements still resolve after renaming to pagan-gen; the MCP server is always installed now

[project.scripts]
pagan = "pagan.cli:main"
pagan-gen = "pagan.cli:main"  # so `uvx pagan-gen ...` (the MCP Registry entry) finds a command

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagan = ["templates/*", "skill/*", "skill/topics/*"]

[tool.mypy]
strict = true
files = ["src/pagan", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: benchmarks (a few seconds; deselect with -m 'not slow')"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long lines are fine; no formatter is enforced
