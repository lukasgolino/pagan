[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagan"
version = "0.1.0"
description = "PAGAN (Pixel Art Grammar And Notation): write pixel art as text, build it into PNGs and game-ready assets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Golino" }]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pagan = "pagan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagan = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
