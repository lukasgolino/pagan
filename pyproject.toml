[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pagan"
version = "0.13.0"
description = "PAGAN (Pixel Art Grammar And Notation): write pixel art as text, build it into PNGs and game-ready assets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Golino" }]
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML", "mcp>=2.3,<3"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
pagan = "pagan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagan = ["templates/*", "skill/*"]

[tool.mypy]
strict = true
files = ["src/pagan", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: benchmarks (a few seconds; deselect with -m 'not slow')"]
