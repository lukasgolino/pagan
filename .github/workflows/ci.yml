name: CI

# Tiered for Actions minutes. Every push: lint, types and tests on one Python. Big checks (all Pythons, Godot) run on
# the PR once it leaves draft (PRs stay drafts while in development and review), and again only if a commit lands
# after that: the last gate before merge. Run workflow runs everything.
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # one Python on a push; all three before merge
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke test CLI
        run: pagan --version
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Run tests
        run: pytest
      - name: Generated docs are up to date
        run: python -m pagan.docs --check
      - name: Lint the demo project
        working-directory: examples/demo
        run: pagan lint

  godot:
    # Builds the demo into the example Godot project, checks the committed output is identical
    # (deterministic builds), then loads everything in a real headless Godot.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2-stable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          rm ~/godot/godot.zip
      - name: Point GODOT at the binary
        run: |
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build the demo and check the committed output is up to date
        working-directory: examples/demo
        run: |
          pagan build --verify-godot
          git status --porcelain -- ../godot/assets/generated
          test -z "$(git status --porcelain -- ../godot/assets/generated)" || (echo "Generated output differs from the commit: run pagan build in examples/demo and commit" && git diff --stat && exit 1)
      - name: "Virtual display and software GPU (rendering tests: Forward+, Mobile, Compatibility)"
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: Godot end-to-end tests
        run: env -u DISPLAY pytest tests/test_godot.py tests/test_views.py tests/test_offscreen.py -v  # PAGAN starts its own offscreen display
