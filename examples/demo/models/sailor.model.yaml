name: sailor
description: >
  Deckhand character: tricorn hat, blue shirt, brown trousers, dark boots. Top-down 3/4 view like the
  ship, 8 headings, 4-frame walk where legs and arms swing in opposition (body stays put, so no jumps).
palette: ember
size: [32, 32]
pivot: [16, 26]
origin: [0, 0, 0]               # between the feet, on the ground
directions: 8
outline: auto
status: draft
style_version: 1
tags: [character, crew]

materials:
  skin:  { keys: ["m", "n"] }
  shirt: { keys: ["i", "j", "k"] }
  cloth: { keys: ["1", "2", "3"] }   # trousers, hat
  boot:  { keys: ["0", "1"] }
  eye:   { keys: ["0"] }

parts:
  - box: { from: [-1, 1, 0], to: [0, 2, 1], material: boot }
    id: left_leg
  - box: { from: [-1, 1, 2], to: [0, 2, 6], material: cloth }
    id: left_leg
  - box: { from: [-1, -2, 0], to: [0, -1, 1], material: boot }
    id: right_leg
  - box: { from: [-1, -2, 2], to: [0, -1, 6], material: cloth }
    id: right_leg
  - box: { from: [-1, -3, 7], to: [1, 3, 13], material: shirt }          # torso
  - box: { from: [-1, 4, 8], to: [0, 4, 12], material: shirt }           # left arm
    id: left_arm
  - box: { from: [-1, 4, 7], to: [0, 4, 7], material: skin }
    id: left_arm
  - box: { from: [-1, -4, 8], to: [0, -4, 12], material: shirt }         # right arm
    id: right_arm
  - box: { from: [-1, -4, 7], to: [0, -4, 7], material: skin }
    id: right_arm
  - box: { from: [-2, -2, 14], to: [2, 2, 18], material: skin }          # head
  - box: { from: [-2, -2, 15], to: [-2, 2, 18], material: cloth }         # hair at the back
  - box: { from: [3, 1, 16], to: [3, 1, 16], material: eye }
    mirror: true
  - box: { from: [-2, -3, 19], to: [2, 3, 19], material: cloth }         # hat brim
  - box: { from: [-1, -2, 20], to: [1, 2, 20], material: cloth }         # hat crown

animations:
  walk:
    fps: 8
    poses:
      - { left_leg: { offset: [1, 0, 0] }, right_leg: { offset: [-1, 0, 0] }, left_arm: { offset: [-1, 0, 0] }, right_arm: { offset: [1, 0, 0] } }
      - {}
      - { left_leg: { offset: [-1, 0, 0] }, right_leg: { offset: [1, 0, 0] }, left_arm: { offset: [1, 0, 0] }, right_arm: { offset: [-1, 0, 0] } }
      - {}
