name: sailor
description: >
  Deckhand character: tricorn hat, blue shirt, brown trousers, dark boots. Top-down 3/4 view like the
  ship, 8 headings, 4-frame walk where legs and arms swing in opposition (body stays put, so no jumps),
  and a 4-frame cutlass swing (the sword only exists during the swing).
palette: ember
size: [32, 32]
pivot: [16, 26]
origin: [0, 0, 0]               # between the feet, on the ground
directions: 8
outline: auto
status: draft
style_version: 1
tags: [character, crew]

materials:
  skin:  { keys: ["m", "n"] }
  shirt: { keys: ["i", "j", "k"] }
  cloth: { keys: ["1", "2", "3"] }   # trousers, hat
  boot:  { keys: ["0", "1"] }
  eye:   { keys: ["0"] }
  steel: { keys: ["j", "k"] }

parts:
  - box: { from: [-1, 1, 0], to: [0, 2, 1], material: boot }
    id: left_leg
  - box: { from: [-1, 1, 2], to: [0, 2, 6], material: cloth }
    id: left_leg
  - box: { from: [-1, -2, 0], to: [0, -1, 1], material: boot }
    id: right_leg
  - box: { from: [-1, -2, 2], to: [0, -1, 6], material: cloth }
    id: right_leg
  - box: { from: [-1, -3, 7], to: [1, 3, 13], material: shirt }          # torso
  - box: { from: [-1, 4, 8], to: [0, 4, 12], material: shirt }           # left arm
    id: left_arm
  - box: { from: [-1, 4, 7], to: [0, 4, 7], material: skin }
    id: left_arm
  - box: { from: [-1, -4, 8], to: [0, -4, 12], material: shirt }         # right arm
    id: right_arm
  - box: { from: [-1, -4, 7], to: [0, -4, 7], material: skin }
    id: right_arm
  - box: { from: [-2, -2, 14], to: [2, 2, 18], material: skin }          # head
    id: head
  - box: { from: [-2, -2, 15], to: [-2, 2, 18], material: cloth }         # hair at the back
    id: head
  - box: { from: [3, 1, 16], to: [3, 1, 16], material: eye }
    mirror: true
    id: head
  - box: { from: [-2, -3, 19], to: [2, 3, 19], material: cloth }         # hat brim
    id: hat
  - box: { from: [-1, -2, 20], to: [1, 2, 20], material: cloth }         # hat crown
    id: hat

  # Cutlass: three hidden parts, one per swing position; the swing poses show one at a time.
  - line: { from: [0, -5, 13], to: [0, -5, 20], material: steel }
    id: sword_up
    hidden: true
  - line: { from: [1, -5, 11], to: [6, -5, 15], material: steel }
    id: sword_mid
    hidden: true
  - line: { from: [1, -5, 8], to: [7, -5, 5], material: steel }
    id: sword_down
    hidden: true

# Meshes (3D games): parts as nodes. The game reads `meta` from each node's "extras" (hit zones, what can fly off).
rig:
  head: { pivot: [0, 0, 14], meta: { hitzone: head } }
  hat: { parent: head, meta: { detachable: true } }

animations:
  walk:
    fps: 8
    poses:
      - { left_leg: { offset: [1, 0, 0] }, right_leg: { offset: [-1, 0, 0] }, left_arm: { offset: [-1, 0, 0] }, right_arm: { offset: [1, 0, 0] } }
      - {}
      - { left_leg: { offset: [-1, 0, 0] }, right_leg: { offset: [1, 0, 0] }, left_arm: { offset: [1, 0, 0] }, right_arm: { offset: [-1, 0, 0] } }
      - {}
  swing:
    fps: 10
    loop: false
    poses:
      - { show: [sword_up], right_arm: { offset: [0, 0, 2] } }
      - { show: [sword_mid], right_arm: { offset: [1, 0, 1] } }
      - { show: [sword_down], right_arm: { offset: [1, 0, 0] } }
      - { show: [sword_down], right_arm: { offset: [1, 0, 0] } }
