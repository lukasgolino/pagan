  "1": { hex: "#1d2233", name: deep }
  "2": { hex: "#343b52", name: slate_dark }
  "3": { hex: "#565f7a", name: slate }
  "4": { hex: "#8590a8", name: fog }
  "5": { hex: "#c3cad6", name: mist }
  "6": { hex: "#eef0f2", name: foam }
  "7": { hex: "#0f2a2e", name: kelp_deep }
  "8": { hex: "#17464a", name: kelp }
  "9": { hex: "#22706b", name: teal }
  "a": { hex: "#3fa38f", name: seaglass }
  "b": { hex: "#86d1b3", name: spray }
  "c": { hex: "#241a38", name: dusk_deep }
  "d": { hex: "#3e2f5b", name: dusk }
  "e": { hex: "#635089", name: heather }
  "f": { hex: "#9a83b8", name: lavender }
